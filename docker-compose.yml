services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dfs_delivery
      POSTGRES_USER: dfs
      POSTGRES_PASSWORD: dfs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfs -d dfs_delivery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
